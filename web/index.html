<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Git Graph</title>
	<meta name="csrf-token" content="%%CSRF_TOKEN%%">
	<script>
		(function () {
			try {
				var stored = localStorage.getItem('git-graph-theme');
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: window.matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
				document.documentElement.setAttribute('data-theme', theme);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		})();
	</script>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<div id="app">
		<header id="toolbar">
			<div class="brand">Git Graph</div>
			<div id="repoLabel" class="repo-label"></div>
			<div id="branchLabel" class="branch-label"></div>
			<label class="toolbar-field">Branches
				<select id="branchFilter">
					<option value="">Show All</option>
				</select>
			</label>
			<label class="toolbar-check"><input type="checkbox" id="showRemotes" checked> Remotes</label>
			<label class="toolbar-check"><input type="checkbox" id="showStashes" checked> Stashes</label>
			<button type="button" id="fetchBtn" title="Fetch from remotes">Fetch</button>
			<button type="button" id="findBtn" title="Find (Ctrl/Cmd+F)">Find</button>
			<button type="button" id="refreshBtn" title="Refresh (Ctrl/Cmd+R)">Refresh</button>
			<button type="button" id="themeBtn" title="Switch theme"></button>
		</header>
		<div id="findBar" hidden>
			<input id="findInput" type="search" placeholder="Find in message, author, hash, branch, tag…">
			<span id="findCount"></span>
			<button type="button" id="findPrev">Prev</button>
			<button type="button" id="findNext">Next</button>
			<button type="button" id="findClose">Close</button>
		</div>
		<div id="errorBanner" hidden role="alert" aria-live="polite"></div>
		<div id="tableHead">
			<table>
				<colgroup>
					<col id="graphCol">
					<col>
					<col class="date-col">
					<col class="author-col">
					<col class="hash-col">
				</colgroup>
				<thead>
					<tr>
						<th>Graph</th>
						<th>Description</th>
						<th>Date</th>
						<th>Author</th>
						<th>Commit</th>
					</tr>
				</thead>
			</table>
		</div>
		<div id="view">
			<svg id="commitGraph" xmlns="http://www.w3.org/2000/svg"></svg>
			<div id="commitTable">
				<table>
					<colgroup>
						<col class="graph-col">
						<col>
						<col class="date-col">
						<col class="author-col">
						<col class="hash-col">
					</colgroup>
					<tbody id="commitRows"></tbody>
				</table>
				<div id="loadMore" hidden><button type="button" id="loadMoreBtn">Load More Commits</button></div>
			</div>
		</div>
	</div>
	<div id="contextMenu" hidden></div>
	<div id="dialog" hidden>
		<div class="dialog-card">
			<h3 id="dialogTitle"></h3>
			<div id="dialogBody"></div>
			<div class="dialog-actions">
				<button type="button" id="dialogCancel">Cancel</button>
				<button type="button" class="primary" id="dialogOk">OK</button>
			</div>
		</div>
	</div>
	<div id="diffOverlay" hidden>
		<div id="diffBar">
			<div id="diffTitle"></div>
			<button type="button" id="diffClose">Close</button>
		</div>
		<div id="monacoHost" class="monaco-host"></div>
	</div>
	<script src="/vendor/monaco/vs/loader.js"></script>
	<script>
		window.require.config({ paths: { vs: '/vendor/monaco/vs' } });
		window.MonacoEnvironment = {
			getWorkerUrl: function () {
				const origin = window.location.origin;
				const worker = origin + '/vendor/monaco/vs/base/worker/workerMain.js';
				const body = "self.MonacoEnvironment={baseUrl:'" + origin + "/vendor/monaco/'};importScripts('" + worker + "');";
				return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(body);
			}
		};
	</script>
	<script type="module" src="/app.js"></script>
</body>
</html>
